<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVault: Web Crypto Manager</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        h2 { margin-top: 0; color: var(--primary); font-size: 1.2rem; }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); }

        button:hover { opacity: 0.8; }

        /* Password Strength */
        .strength-meter { height: 8px; background: #334155; border-radius: 4px; margin: 5px 0; overflow: hidden; }
        .strength-bar { height: 100%; width: 0%; transition: 0.3s; }

        /* History Panel */
        .history-item {
            background: #334155;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #lock-screen {
            position: fixed;
            top:0; left:0; width: 100%; height: 100%;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="card" style="width: 350px; text-align: center;">
            <h2>🔐 Secure Access</h2>
            <p>Ilagay ang Master Password para i-decrypt ang data.</p>
            <input type="password" id="master-pwd-input" placeholder="Master Password...">
            <button class="btn-primary" style="width: 100%;" onclick="initializeSession()">Open Vault</button>
        </div>
    </div>

    <div class="container">
        <header style="text-align: center;">
            <h1>SecureVault</h1>
            <p style="opacity: 0.7;">Client-side Encryption & Password Manager</p>
        </header>

        <section class="card">
            <h2>Text Encryption (AES-GCM)</h2>
            <textarea id="text-input" rows="4" placeholder="I-type ang mensahe dito..."></textarea>
            <div class="btn-group">
                <button class="btn-primary" onclick="handleEncrypt()">Encrypt</button>
                <button class="btn-outline" onclick="handleDecrypt()">Decrypt</button>
                <button onclick="copyToClipboard('text-input')">Copy</button>
            </div>
        </section>

        <section class="card">
            <h2>Password Generator</h2>
            <input type="text" id="gen-password-display" placeholder="Generated Password..." oninput="updateStrengthMeter(this.value)">
            
            <div class="strength-meter"><div id="strength-bar" class="strength-bar"></div></div>
            <small id="strength-text">Strength: N/A</small>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top:10px;">
                <label>Length: <span id="len-val">16</span></label>
                <input type="range" id="pass-length" min="4" max="128" value="16" oninput="document.getElementById('len-val').innerText=this.value">
            </div>

            <div class="btn-group" style="margin-top: 10px;">
                <label><input type="checkbox" id="chk-upper" checked> ABC</label>
                <label><input type="checkbox" id="chk-lower" checked> abc</label>
                <label><input type="checkbox" id="chk-num" checked> 123</label>
                <label><input type="checkbox" id="chk-sym" checked> !@#</label>
            </div>

            <div class="btn-group" style="margin-top: 15px;">
                <button class="btn-primary" onclick="generatePassword()">Generate</button>
                <button onclick="copyToClipboard('gen-password-display')">Copy & Save</button>
            </div>
        </section>

        <section class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Activity History</h2>
                <button class="btn-danger" style="padding: 5px 10px;" onclick="clearHistory()">Clear All</button>
            </div>
            <div id="history-list" style="max-height: 300px; overflow-y: auto; margin-top: 10px;">
                </div>
        </section>
    </div>

    <script>
        /**
         * SECURITY CORE: Web Crypto API Implementations
         */
        let sessionKey = null;

        async function deriveKey(password) {
            const encoder = new TextEncoder();
            const salt = encoder.encode('secure-vault-salt-123'); // Sa real app, dapat ito ay random at naka-store
            const baseKey = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
            
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
                baseKey,
                { name: 'AES-GCM', length: 256 },
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function encryptData(text) {
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const encoded = new TextEncoder().encode(text);
            const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, sessionKey, encoded);
            
            // Combine IV + Ciphertext for storage
            const combined = new Uint8Array(iv.length + ciphertext.byteLength);
            combined.set(iv);
            combined.set(new Uint8Array(ciphertext), iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        async function decryptData(encryptedB64) {
            try {
                const combined = new Uint8Array(atob(encryptedB64).split('').map(c => c.charCodeAt(0)));
                const iv = combined.slice(0, 12);
                const ciphertext = combined.slice(12);
                const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, sessionKey, ciphertext);
                return new TextDecoder().decode(decrypted);
            } catch (e) {
                return null;
            }
        }

        /**
         * SESSION MANAGEMENT
         */
        async function initializeSession() {
            const pwd = document.getElementById('master-pwd-input').value;
            if (!pwd) return alert("Paki-input ang master password!");

            sessionKey = await deriveKey(pwd);
            
            // Subukan i-decrypt ang history
            const success = await loadHistory();
            if (success) {
                document.getElementById('lock-screen').classList.add('hidden');
            } else {
                alert("Maling password o corrupted data!");
            }
        }

        /**
         * HISTORY & LOCAL STORAGE
         */
        async function saveToHistory(action, data) {
            const history = await getHistoryData();
            const entry = {
                id: Date.now(),
                timestamp: new Date().toLocaleString(),
                action,
                preview: data.substring(0, 30) + (data.length > 30 ? '...' : '')
            };
            history.unshift(entry);
            
            const encryptedHistory = await encryptData(JSON.stringify(history));
            localStorage.setItem('vault_history', encryptedHistory);
            renderHistory(history);
        }

        async function getHistoryData() {
            const raw = localStorage.getItem('vault_history');
            if (!raw) return [];
            const decrypted = await decryptData(raw);
            return decrypted ? JSON.parse(decrypted) : [];
        }

        async function loadHistory() {
            const raw = localStorage.getItem('vault_history');
            if (!raw) {
                renderHistory([]);
                return true;
            }
            const decrypted = await decryptData(raw);
            if (decrypted) {
                renderHistory(JSON.parse(decrypted));
                return true;
            }
            return false;
        }

        function renderHistory(history) {
            const list = document.getElementById('history-list');
            list.innerHTML = history.length ? '' : '<p style="text-align:center; opacity:0.5;">Walang history.</p>';
            history.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div>
                        <strong>${item.action}</strong><br>
                        <small>${item.timestamp} - ${item.preview}</small>
                    </div>
                    <button class="btn-danger" style="padding:2px 8px;" onclick="deleteHistoryItem(${item.id})">×</button>
                `;
                list.appendChild(div);
            });
        }

        async function deleteHistoryItem(id) {
            let history = await getHistoryData();
            history = history.filter(item => item.id !== id);
            const encryptedHistory = await encryptData(JSON.stringify(history));
            localStorage.setItem('vault_history', encryptedHistory);
            renderHistory(history);
        }

        async function clearHistory() {
            if(confirm("Sigurado ka bang buburahin ang lahat ng history?")) {
                localStorage.removeItem('vault_history');
                renderHistory([]);
            }
        }

        /**
         * UI HANDLERS
         */
        async function handleEncrypt() {
            const input = document.getElementById('text-input').value;
            if (!input) return;
            const encrypted = await encryptData(input);
            document.getElementById('text-input').value = encrypted;
            saveToHistory('Encryption', input);
        }

        async function handleDecrypt() {
            const input = document.getElementById('text-input').value;
            if (!input) return;
            const decrypted = await decryptData(input);
            if (decrypted) {
                document.getElementById('text-input').value = decrypted;
                saveToHistory('Decryption', decrypted);
            } else {
                alert("Hindi ma-decrypt! Posibleng mali ang format o key.");
            }
        }

        function generatePassword() {
            const length = document.getElementById('pass-length').value;
            const charset = {
                upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
                lower: "abcdefghijklmnopqrstuvwxyz",
                num: "0123456789",
                sym: "!@#$%^&*()_+~`|}{[]:;?><,./-="
            };

            let charPool = "";
            if (document.getElementById('chk-upper').checked) charPool += charset.upper;
            if (document.getElementById('chk-lower').checked) charPool += charset.lower;
            if (document.getElementById('chk-num').checked) charPool += charset.num;
            if (document.getElementById('chk-sym').checked) charPool += charset.sym;

            if (!charPool) return alert("Pumili ng kahit isang option!");

            let password = "";
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);
            for (let i = 0; i < length; i++) {
                password += charPool.charAt(array[i] % charPool.length);
            }

            document.getElementById('gen-password-display').value = password;
            updateStrengthMeter(password);
        }

        function updateStrengthMeter(pass) {
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            let score = 0;

            if (pass.length > 8) score++;
            if (pass.length > 15) score++;
            if (/[A-Z]/.test(pass) && /[a-z]/.test(pass)) score++;
            if (/[0-9]/.test(pass)) score++;
            if (/[^A-Za-z0-9]/.test(pass)) score++;

            const colors = ['#ef4444', '#f59e0b', '#22c55e', '#10b981'];
            const labels = ['Weak', 'Medium', 'Strong', 'Very Strong'];
            
            const level = Math.min(Math.floor(score / 1.5), 3);
            bar.style.width = (pass.length > 0 ? (level + 1) * 25 : 0) + "%";
            bar.style.backgroundColor = colors[level];
            text.innerText = "Strength: " + (pass.length > 0 ? labels[level] : 'N/A');
        }

        function copyToClipboard(elementId) {
            const val = document.getElementById(elementId).value;
            if (!val) return;
            navigator.clipboard.writeText(val);
            if (elementId === 'gen-password-display') {
                saveToHistory('Password Gen', val);
            }
            alert("Copied to clipboard!");
        }
    </script>
</body>
</html>
